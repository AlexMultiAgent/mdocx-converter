<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="mGrad2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5B9BD5"/>
      <stop offset="1" stop-color="#2B579A"/>
    </linearGradient>
    <linearGradient id="wGrad2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2B579A"/>
      <stop offset="1" stop-color="#1E3A6F"/>
    </linearGradient>
  </defs>

  <!-- 2 层堆叠文档 -->
  <g transform="translate(14 12) rotate(-2 16 22)">
    <rect x="0" y="0" width="30" height="42" rx="1.5" fill="#E8F0FA" stroke="#A0B8D8" stroke-width="0.8"/>
  </g>
  <g transform="translate(12 8)">
    <path d="M0 0 L34 0 L42 8 L42 50 L0 50 Z" fill="white" stroke="#5B9BD5" stroke-width="1.2"/>
    <path d="M34 0 L34 8 L42 8" fill="#D0D9E8" stroke="#5B9BD5" stroke-width="1"/>
    <!-- M → DOCX 简化文字 -->
    <text x="21" y="34" text-anchor="middle" fill="#2B579A" font-size="11" font-family="Arial, sans-serif" font-weight="900">M→DOCX</text>
  </g>

  <!-- M 徽章 -->
  <g transform="translate(0 20)">
    <path d="M0 0 L20 0 L20 26 L10 30 L0 26 Z" fill="url(#mGrad2)" stroke="white" stroke-width="1.5"/>
    <text x="10" y="18" text-anchor="middle" fill="white" font-size="14" font-family="Arial, sans-serif" font-weight="900">M</text>
  </g>

  <!-- W 徽章 -->
  <g transform="translate(44 20)">
    <path d="M0 0 L20 0 L20 26 L10 30 L0 26 Z" fill="url(#wGrad2)" stroke="white" stroke-width="1.5"/>
    <rect x="4" y="4" width="12" height="16" rx="1" fill="white"/>
    <text x="10" y="14" text-anchor="middle" fill="#2B579A" font-size="8" font-family="Arial, sans-serif" font-weight="900">W</text>
    <rect x="6" y="16" width="8" height="0.5" fill="#2B579A" opacity="0.5"/>
  </g>
</svg>
