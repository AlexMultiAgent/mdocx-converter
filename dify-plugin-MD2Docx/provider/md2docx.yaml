# Note: Dify 1.4+ allows the provider declaration to override manifest.yaml fields.
# The label and description below intentionally mirror manifest.yaml for consistency
# when the plugin is listed in Dify's tool selector vs. plugin marketplace.
identity:
  author: "alexmultiagent"
  name: "md2docx"
  icon: "icon.svg"
  label:
    en_US: "md2docx"
    zh_Hans: "md2docx"
  description:
    en_US: "Convert Markdown to polished DOCX with templates, Mermaid, and style presets."
    zh_Hans: "将 Markdown 转换为精美 DOCX，支持模板、Mermaid 和样式预设。"
  tags:
    - "productivity"
    - "utilities"

tools:
  - "tools/md_to_docx.yaml"
  - "tools/md_to_docx_advanced.yaml"

extra:
  python:
    source: "provider/md2docx.py"
