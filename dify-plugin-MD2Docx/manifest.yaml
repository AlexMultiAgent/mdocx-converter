version: "0.5.1"
type: plugin
author: "alexmultiagent"
name: "md2docx"
created_at: "2026-06-02T00:00:00.000000Z"
repo: "https://github.com/AlexMultiAgent/mdocx-converter"
contact: "zhangven@gmail.com"
tags:
  - "utilities"
  - "productivity"

label:
  en_US: "md2docx"
  zh_Hans: "md2docx"

description:
  en_US: >
    Convert Markdown to polished DOCX with built-in Chinese/English templates.
    Supports technical document, business report, official document, academic paper, and thesis style presets,
    Mermaid diagram rendering, and fine-grained font/margin/spacing control.
  zh_Hans: >
    将 Markdown 转换为精美 DOCX 文档，内置中英文模板。
    支持技术文档、商业报告、公务公文、学术论文、学位论文五种样式预设，
    Mermaid 图表渲染，以及字体/页边距/行距的精细控制。

icon: "icon.svg"

resource:
  memory: 536870912
  permission:
    tool:
      enabled: true
    model:
      enabled: false
    node:
      enabled: false
    endpoint:
      enabled: false
    app:
      enabled: false
    storage:
      enabled: true
      size: 104857600

plugins:
  tools:
    - "provider/md2docx.yaml"

meta:
  version: "0.5.1"
  arch:
    - "amd64"
    - "arm64"
  runner:
    language: "python"
    version: "3.12"
    entrypoint: "main"
  minimum_dify_version: "1.14.0"

privacy: "./PRIVACY.md"

# Outbound domains this plugin may reach. Mermaid Ink is only contacted when
# `mermaid_enabled` is true (or when the standalone Mermaid tool is used);
# a self-hosted instance can be pointed at with `mermaid_api_url`.
network:
  domains:
    - "mermaid.ink"

# ── Package & network notes ──────────────────────────────────────────────────
# Approx .difypkg size: ~145 KB (uncompressed ~238 KB). The Pandoc binary is
# **bundled** inside the `pypandoc-binary` pip wheel and extracted into the
# plugin venv at install time — there is NO runtime download from GitHub or any
# other host. The daemon rejects packages whose uncompressed size exceeds
# MAX_PLUGIN_PACKAGE_SIZE (50 MB by default), which is why the Pandoc binary
# must never be vendored into this package.
# No outbound network access is required for Pandoc itself. Only Mermaid
# preprocessing (when `mermaid_enabled: true`) calls https://mermaid.ink.
# See PRIVACY.md and README.md for details.
