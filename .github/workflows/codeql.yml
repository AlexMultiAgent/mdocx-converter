# CodeQL analysis for both products in this monorepo.
#
# The VS Code extension (TypeScript) and the Dify plugin (Python) live in
# separate trees, so each language is scanned with its own `paths` — pointing
# CodeQL at the repo root would analyze the wrong tree and silently produce
# no alerts. PowerShell and Shell sources are present too, but CodeQL does not
# support them, so they are not scanned.
#
# Code scanning is free for public repositories on GitHub.com.

name: CodeQL

# Read-only at the workflow level. `security-events: write` is granted to the
# analyze job only -- the workflow token must not be able to write outside the
# job that actually uploads the SARIF results.
permissions:
  contents: read
  actions: read
  packages: read

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Weekly, on an off-peak minute so it does not collide with the other
    # repos' crons.
    - cron: '31 4 * * 1'

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Job-level permissions replace the workflow-level ones, so the read
    # permissions are repeated here and only the SARIF upload is writable.
    permissions:
      contents: read
      actions: read
      packages: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: javascript-typescript
            paths: VSC-plugin-MD2Docx-Converter
          - language: python
            paths: dify-plugin-MD2Docx
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Initialize CodeQL
        uses: github/codeql-action/init@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea  # v4.39.4
        with:
          languages: ${{ matrix.language }}
          paths: ${{ matrix.paths }}
          queries: security-and-quality

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea  # v4.39.4
        with:
          category: "/language:${{ matrix.language }}"
