name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  dify-plugin:
    name: Dify plugin tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dify-plugin-MD2Docx
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Syntax check
        run: python -c "import ast, pathlib; [ast.parse(p.read_text(encoding='utf-8')) for p in pathlib.Path('src').glob('*.py')]; print('Syntax OK')"

      - name: Run tests
        run: pytest tests/ -v

  template-sync:
    name: Template sync check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify the Dify templates match the VS Code source of truth
        run: bash scripts/sync-templates.sh --check
