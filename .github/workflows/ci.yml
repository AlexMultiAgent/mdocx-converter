name: CI

permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # Every job below declares its own `permissions:` block, so the workflow
  # token cannot gain write access by accident. None of these jobs pushes a
  # commit, creates a release or uploads release assets -- the .difypkg and the
  # .vsix leave the workflow as Actions artifacts (the artifact API), not as
  # repository contents -- so `contents: read` is enough for all five.
  dify-plugin:
    name: Dify plugin tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        dify-plugin-version:
          # 0.9.0 is the floor declared in requirements.txt.
          - "0.9.0"
          - "0.9.1"
          - "0.11.0"
          - "0.11.1"
    defaults:
      run:
        working-directory: dify-plugin-MD2Docx
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt "dify_plugin==${{ matrix.dify-plugin-version }}"

      - name: Syntax check
        run: python -c "import ast, pathlib; [ast.parse(p.read_text(encoding='utf-8')) for p in pathlib.Path('src').glob('*.py')]; print('Syntax OK')"

      - name: Run tests
        run: pytest tests/ -v

      - name: Build plugin package
        run: python scripts/package.py --output dist/MD2Docx.difypkg

      - name: Upload plugin package
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: MD2Docx-dify-plugin-${{ matrix.dify-plugin-version }}
          path: dify-plugin-MD2Docx/dist/MD2Docx.difypkg
          if-no-files-found: error

  vsc-plugin:
    name: VS Code plugin tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: VSC-plugin-MD2Docx-Converter
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: "24"

      - name: Install Pandoc
        run: sudo apt-get update && sudo apt-get install -y pandoc

      - name: Install dependencies
        run: npm ci

      - name: Compile and run the unit tests
        run: npm test

      - name: Run real-Pandoc profile exports
        run: npm run test:e2e

      - name: Build the VSIX
        run: npm run package

      - name: Upload the VSIX
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: mdocx-converter-vsix
          path: VSC-plugin-MD2Docx-Converter/*.vsix
          if-no-files-found: error

  template-sync:
    name: Template sync check
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Verify the Dify templates match the VS Code source of truth
        run: bash scripts/sync-templates.sh --check

  preset-parity:
    name: Preset parity check
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.12"

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: "24"

      - name: Install VS Code plugin dependencies
        working-directory: VSC-plugin-MD2Docx-Converter
        run: npm ci

      - name: Install Dify plugin dependencies
        working-directory: dify-plugin-MD2Docx
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Compile VS Code preset sources
        working-directory: VSC-plugin-MD2Docx-Converter
        run: npm run compile

      - name: Verify preset parity
        run: python scripts/check-preset-parity.py

  dependency-audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.12"

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: "24"

      - name: Install locked VS Code dependencies
        working-directory: VSC-plugin-MD2Docx-Converter
        run: npm ci

      - name: Audit npm dependencies
        working-directory: VSC-plugin-MD2Docx-Converter
        run: npm audit --audit-level=moderate

      - name: Audit Python dependencies
        working-directory: dify-plugin-MD2Docx
        run: |
          python -m pip install --upgrade pip pip-audit
          pip-audit -r requirements.txt
